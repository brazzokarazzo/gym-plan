# Ruft alle 10 Minuten die Studio-Auslastung (McFit Heilbronn) ab und speichert sie
# platzsparend im Branch "data" (eine Datei pro Monat: util-YYYYMM.json).
# Format je Tag: 16 Zeichen Stundenwerte 6–21 Uhr + 96 Zeichen 10-Minuten-Werte 6:00–21:50,
# ein Zeichen pro Wert = String.fromCharCode(48 + Prozent), '.' = kein Wert.
# Der Branch wird jedes Mal mit nur einem Commit überschrieben, damit das Repo klein bleibt.
name: Studio-Auslastung

on:
  schedule:
    - cron: '*/10 4-21 * * *'   # UTC – deckt 6–22 Uhr deutscher Zeit (Sommer und Winter) ab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auslastung
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Daten-Branch holen
        env:
          REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if ! git clone --depth 1 --branch data "$REPO" d; then
            mkdir d && cd d && git init -b data && git remote add origin "$REPO"
          fi

      - name: Auslastung abrufen
        working-directory: d
        run: |
          cat > /tmp/abruf.mjs <<'EOF'
          import fs from 'node:fs';
          const URL = 'https://rsg-group.api.magicline.com/connect/v1/studio/6859406990/utilization';
          const H0 = 6, H1 = 22, NH = H1 - H0, NS = NH * 6, LEN = NH + NS;
          const enc = p => String.fromCharCode(48 + Math.max(0, Math.min(100, Math.round(p))));
          const t = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Berlin', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
            .formatToParts(new Date()).map(p => [p.type, p.value]));
          const key = t.year + t.month + t.day, h = +t.hour, m = +t.minute;
          if (h < H0) { console.log('vor 6 Uhr – nichts zu tun'); process.exit(0); }
          const r = await fetch(URL, { headers: { accept: 'application/json' } });
          if (!r.ok) { console.log('HTTP ' + r.status); process.exit(0); }
          const items = (await r.json()).items || [];
          const file = `util-${t.year}${t.month}.json`;
          const data = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : {};
          const rec = (data[key] || '.'.repeat(LEN)).split('');
          const ci = items.findIndex(i => i.isCurrent);
          items.forEach((it, i) => {
            const hh = parseInt(it.startTime);
            if (hh < H0 || hh >= H1 || (ci >= 0 && i > ci)) return;   // Zukunft überspringen
            rec[hh - H0] = enc(it.percentage);
          });
          if (ci >= 0 && h >= H0 && h < H1) rec[NH + (h - H0) * 6 + Math.floor(m / 10)] = enc(items[ci].percentage);
          data[key] = rec.join('');
          fs.writeFileSync(file, JSON.stringify(data));
          console.log(key, h + ':' + String(m).padStart(2, '0'), ci >= 0 ? items[ci].percentage + ' %' : '–');
          EOF
          node /tmp/abruf.mjs

      - name: Speichern
        working-directory: d
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git rev-parse --verify -q HEAD >/dev/null && git diff --cached --quiet; then echo 'keine Änderung'; exit 0; fi
          git checkout -q --orphan neu
          git commit -q -m "Auslastung $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M')"
          git push -q -f origin neu:data
