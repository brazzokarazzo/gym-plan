<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Plan">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>Gym Plan</title>
<style>
:root{
  --bg:#0b0b0f; --bg2:#15151c; --bg3:#1f1f29; --line:#2a2a36;
  --tx:#f4f4f8; --tx2:#a0a0b2; --tx3:#6b6b7e;
  --acc:#ff6a3d; --acc2:#ff8f5e; --accbg:rgba(255,106,61,.14);
  --ok:#34c759; --okbg:rgba(52,199,89,.15); --warn:#ffcc00; --bad:#ff453a;
  --r:16px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--tx);background:var(--bg3);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--acc)}
input::placeholder{color:var(--tx3)}
h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-.5px}
h2{font-size:20px;margin:22px 0 10px;font-weight:700}
h3{font-size:17px;margin:0;font-weight:650}
.muted{color:var(--tx2)} .small{font-size:13px} .tiny{font-size:11px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 96px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.back{color:var(--acc);font-weight:600;font-size:17px;display:flex;align-items:center;gap:4px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(18,18,24,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);
  padding:6px 4px calc(var(--sb) + 6px);z-index:10}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--tx3);padding:4px 0}
.tabbar button.on{color:var(--acc)}
.tabbar svg{width:25px;height:25px}

.card{background:var(--bg2);border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--acc);color:#fff;font-weight:650;
  border-radius:12px;padding:12px 16px;font-size:16px}
.btn:active{opacity:.75}
.btn.sec{background:var(--bg3);color:var(--tx)}
.btn.ghost{background:transparent;color:var(--acc);padding:8px 6px}
.btn.danger{background:rgba(255,69,58,.15);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--bg3);color:var(--tx2);font-size:12px;font-weight:600}
.pill.acc{background:var(--accbg);color:var(--acc)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.chev{color:var(--tx3);font-size:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--bg3);color:var(--tx2);font-size:14px;font-weight:600}
.chip.on{background:var(--acc);color:#fff}
.hero{background:linear-gradient(135deg,#ff6a3d,#c2185b);border:0;color:#fff}
.hero .muted{color:rgba(255,255,255,.8)}
.hero .btn{background:#fff;color:#c2185b}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12px;color:var(--tx2)}
.empty{text-align:center;color:var(--tx2);padding:30px 10px}
.ico{width:40px;height:40px;border-radius:12px;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}

/* bars */
.bar{height:8px;background:var(--bg3);border-radius:9px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:9px;background:var(--acc)}
.bar .zone{position:absolute;top:0;bottom:0;background:rgba(52,199,89,.18)}

/* plan editor */
.pitem{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.pgrid label{font-size:10.5px;color:var(--tx2);display:block;text-align:center;margin-bottom:3px}
.pgrid input{text-align:center;padding:7px 2px}
.iconbtn{width:34px;height:34px;border-radius:10px;background:var(--bg3);display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);font-size:16px;flex:none}

/* workout */
#wo{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.wohead{padding:calc(var(--st) + 8px) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.wohead .ttl{text-align:center;flex:1;min-width:0}
.wohead .ttl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#woscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(var(--sb) + 120px)}
.exname{font-size:17px;font-weight:700}
.sugg{margin:10px 0 6px;padding:8px 10px;border-radius:10px;background:var(--bg3);font-size:13px;color:var(--tx2)}
.sugg.up{background:var(--okbg);color:var(--ok)}
.sugg.down{background:rgba(255,204,0,.12);color:var(--warn)}
.sugg b{color:var(--tx)}
.sgrid{display:grid;grid-template-columns:30px 1fr 64px 52px 46px 40px;gap:6px;align-items:center}
.sgrid.h{font-size:11px;color:var(--tx3);font-weight:600;text-transform:uppercase;margin:8px 0 4px;letter-spacing:.3px}
.sgrid.h span{text-align:center}
.srow{padding:4px 0;border-radius:10px}
.srow input{text-align:center;padding:8px 2px;font-weight:600}
.srow .sn{text-align:center;font-weight:700;color:var(--tx2)}
.srow .prev{text-align:center;color:var(--tx3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow.done{background:var(--okbg)}
.srow.done input{background:transparent;border-color:transparent;color:var(--ok)}
.chk{width:40px;height:36px;border-radius:10px;background:var(--bg3);color:var(--tx3);font-size:18px;font-weight:800}
.srow.done .chk{background:var(--ok);color:#fff}
.timer{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 12px);z-index:25;background:var(--bg3);border:1px solid var(--line);
  border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.timer .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:74px}
.timer .bar{flex:1}
.timer.over{border-color:var(--ok)} .timer.over .t{color:var(--ok)}

/* sheet */
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#sheetbg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg2);border-radius:20px 20px 0 0;max-height:88vh;
  display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;border-top:1px solid var(--line)}
#sheet.on{transform:none}
#sheet .grab{width:38px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 2px}
#sheetc{overflow-y:auto;padding:8px 16px calc(var(--sb) + 18px);-webkit-overflow-scrolling:touch}
.menu button{display:block;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-size:17px}
.menu button:last-child{border-bottom:0}
.menu button.red{color:var(--bad)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--tx2);margin-bottom:5px}
#toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translate(-50%,-120px);background:var(--bg3);border:1px solid var(--line);
  padding:10px 16px;border-radius:12px;z-index:60;transition:transform .25s;font-weight:600;font-size:14px;max-width:90vw}
#toast.on{transform:translate(-50%,0)}
svg.chart{width:100%;height:auto;display:block}
.pr{color:var(--warn);font-weight:700}
</style>
</head>
<body>
<div id="app">
  <div class="scroll" id="view"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="woRoot"></div>
<div id="sheetbg" data-a="closeSheet"></div>
<div id="sheet"><div class="grab"></div><div id="sheetc"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ============ Basis ============ */
const KEY = 'gymplan-v1';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const fmtN = n => n == null ? '' : (Math.round(n * 100) / 100).toString().replace('.', ',');
const fmtKg = n => fmtN(n) + ' kg';
const roundTo = (n, step) => Math.round(n / step) * step;
const e1rm = (w, r, rir) => (w > 0 && r > 0) ? w * (1 + (r + (rir || 0)) / 30) : 0;
const DAY = 864e5;
const fmtDur = ms => { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m/60)} h ${m%60} min` : `${m} min`; };
const fmtClock = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const fmtDate = t => new Date(t).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: '2-digit' });
const weekStart = (t = Date.now()) => { const d = new Date(t); d.setHours(0,0,0,0); const wd = (d.getDay() + 6) % 7; return d.getTime() - wd * DAY; };

const MUSCLES = ['Brust','Rücken','Schultern','Bizeps','Trizeps','Quadrizeps','Beinbeuger','Gesäß','Waden','Bauch','Unterer Rücken'];
const EQUIP = ['Maschine','Kabelzug','Langhantel','Kurzhantel','Multipresse','SZ-Stange','Körpergewicht'];

/* Übungsbibliothek – typische Geräte in McFit-Studios */
const DEFAULT_EX = [
  ['bank_lh','Bankdrücken','Brust','Langhantel',2.5,['Trizeps','Schultern']],
  ['bank_mp','Bankdrücken an der Multipresse','Brust','Multipresse',2.5,['Trizeps','Schultern']],
  ['schraeg_kh','Schrägbankdrücken (Kurzhantel)','Brust','Kurzhantel',2,['Schultern','Trizeps']],
  ['schraeg_mp','Schrägbankdrücken an der Multipresse','Brust','Multipresse',2.5,['Schultern','Trizeps']],
  ['brustpresse','Brustpresse','Brust','Maschine',5,['Trizeps','Schultern']],
  ['butterfly','Butterfly','Brust','Maschine',5,[]],
  ['crossover','Cable Crossover','Brust','Kabelzug',2.5,[]],
  ['dips','Dips','Brust','Körpergewicht',2.5,['Trizeps']],
  ['latzug','Latzug','Rücken','Kabelzug',5,['Bizeps']],
  ['latzug_eng','Latzug eng (V-Griff)','Rücken','Kabelzug',5,['Bizeps']],
  ['klimmzug','Klimmzüge','Rücken','Körpergewicht',2.5,['Bizeps']],
  ['rudern_kabel','Rudern am Kabel (sitzend)','Rücken','Kabelzug',5,['Bizeps']],
  ['rudern_masch','Rudermaschine (brustgestützt)','Rücken','Maschine',5,['Bizeps']],
  ['rudern_lh','Langhantelrudern','Rücken','Langhantel',2.5,['Bizeps','Unterer Rücken']],
  ['rudern_kh','Kurzhantelrudern einarmig','Rücken','Kurzhantel',2,['Bizeps']],
  ['pullover_kabel','Überzüge am Kabel','Rücken','Kabelzug',2.5,[]],
  ['hyper','Hyperextensions','Unterer Rücken','Körpergewicht',2.5,['Gesäß','Beinbeuger']],
  ['kreuzheben','Kreuzheben','Unterer Rücken','Langhantel',5,['Gesäß','Beinbeuger','Rücken']],
  ['schulterpresse','Schulterpresse','Schultern','Maschine',5,['Trizeps']],
  ['schulter_kh','Schulterdrücken (Kurzhantel)','Schultern','Kurzhantel',2,['Trizeps']],
  ['seitheben_kh','Seitheben (Kurzhantel)','Schultern','Kurzhantel',1,[]],
  ['seitheben_kabel','Seitheben am Kabel','Schultern','Kabelzug',1.25,[]],
  ['seitheben_masch','Seitheben-Maschine','Schultern','Maschine',2.5,[]],
  ['reverse_fly','Reverse Butterfly','Schultern','Maschine',2.5,['Rücken']],
  ['facepull','Face Pulls','Schultern','Kabelzug',2.5,['Rücken']],
  ['curl_lh','Langhantel-Curls','Bizeps','Langhantel',2.5,[]],
  ['curl_sz','SZ-Curls','Bizeps','SZ-Stange',2.5,[]],
  ['curl_kh','Kurzhantel-Curls','Bizeps','Kurzhantel',1,[]],
  ['hammer','Hammer-Curls','Bizeps','Kurzhantel',1,[]],
  ['curl_kabel','Bizeps-Curls am Kabel','Bizeps','Kabelzug',2.5,[]],
  ['curl_masch','Bizepsmaschine','Bizeps','Maschine',2.5,[]],
  ['trizeps_kabel','Trizepsdrücken am Kabel','Trizeps','Kabelzug',2.5,[]],
  ['trizeps_ueber','Überkopf-Trizeps am Kabel','Trizeps','Kabelzug',2.5,[]],
  ['french','French Press (SZ)','Trizeps','SZ-Stange',2.5,[]],
  ['trizeps_masch','Trizepsmaschine / Dipmaschine','Trizeps','Maschine',5,[]],
  ['kniebeuge','Kniebeuge','Quadrizeps','Langhantel',2.5,['Gesäß']],
  ['kniebeuge_mp','Kniebeuge an der Multipresse','Quadrizeps','Multipresse',2.5,['Gesäß']],
  ['beinpresse','Beinpresse','Quadrizeps','Maschine',5,['Gesäß']],
  ['hackenschmidt','Hackenschmidt','Quadrizeps','Maschine',5,['Gesäß']],
  ['beinstrecker','Beinstrecker','Quadrizeps','Maschine',2.5,[]],
  ['ausfall','Ausfallschritte (Kurzhantel)','Quadrizeps','Kurzhantel',2,['Gesäß']],
  ['bulgarian','Bulgarian Split Squats','Quadrizeps','Kurzhantel',2,['Gesäß']],
  ['rdl','Rumänisches Kreuzheben','Beinbeuger','Langhantel',2.5,['Gesäß','Unterer Rücken']],
  ['beinbeuger_liegend','Beinbeuger liegend','Beinbeuger','Maschine',2.5,[]],
  ['beinbeuger_sitz','Beinbeuger sitzend','Beinbeuger','Maschine',2.5,[]],
  ['hipthrust','Hip Thrust','Gesäß','Langhantel',5,['Beinbeuger']],
  ['abduktor','Abduktorenmaschine','Gesäß','Maschine',5,[]],
  ['adduktor','Adduktorenmaschine','Quadrizeps','Maschine',5,[]],
  ['wade_steh','Wadenheben stehend','Waden','Maschine',5,[]],
  ['wade_bp','Wadenheben an der Beinpresse','Waden','Maschine',5,[]],
  ['wade_sitz','Wadenheben sitzend','Waden','Maschine',2.5,[]],
  ['crunch_masch','Crunch-Maschine','Bauch','Maschine',2.5,[]],
  ['crunch_kabel','Kabel-Crunch','Bauch','Kabelzug',2.5,[]],
  ['beinheben','Beinheben hängend','Bauch','Körpergewicht',0,[]],
  ['plank','Plank (Sekunden)','Bauch','Körpergewicht',0,[]],
].map(([id,name,muscle,equip,inc,sec]) => ({id,name,muscle,equip,inc,sec,custom:false}));

/* Vorlagen: [exId, Sätze, minWdh, maxWdh, RIR, Pause(s)] */
const TEMPLATES = {
  ppl: { name:'Push / Pull / Beine', desc:'3–6× pro Woche · klassischer Split', days:[
    ['Push',[['bank_lh',3,6,10,2,150],['schraeg_kh',3,8,12,2,120],['schulterpresse',3,8,12,2,120],['seitheben_kabel',3,12,15,1,75],['trizeps_kabel',3,10,15,1,75],['butterfly',2,12,15,1,75]]],
    ['Pull',[['latzug',3,8,12,2,120],['rudern_kabel',3,8,12,2,120],['rudern_kh',2,8,12,2,90],['facepull',3,12,15,1,75],['curl_kh',3,8,12,1,75],['hammer',2,10,12,1,75]]],
    ['Beine',[['kniebeuge_mp',3,6,10,2,180],['beinpresse',3,10,12,2,150],['rdl',3,8,10,2,150],['beinbeuger_sitz',3,10,15,1,90],['beinstrecker',3,12,15,1,90],['wade_steh',4,10,15,1,60]]],
  ]},
  ouk: { name:'Ober- / Unterkörper', desc:'4× pro Woche · A/B-Wechsel', days:[
    ['Oberkörper A',[['bank_lh',3,6,10,2,150],['rudern_kabel',3,8,12,2,120],['schulter_kh',3,8,12,2,120],['latzug',3,8,12,2,120],['seitheben_kh',3,12,15,1,60],['curl_sz',2,8,12,1,75],['trizeps_kabel',2,10,15,1,75]]],
    ['Unterkörper A',[['kniebeuge',3,6,8,2,180],['rdl',3,8,10,2,150],['beinstrecker',3,10,15,1,90],['beinbeuger_liegend',3,10,15,1,90],['wade_steh',3,10,15,1,60],['crunch_kabel',3,10,15,1,60]]],
    ['Oberkörper B',[['schraeg_mp',3,8,12,2,120],['latzug_eng',3,8,12,2,120],['brustpresse',2,10,12,1,90],['rudern_masch',3,8,12,2,120],['reverse_fly',3,12,15,1,60],['hammer',2,10,12,1,60],['trizeps_ueber',2,10,15,1,60]]],
    ['Unterkörper B',[['beinpresse',3,8,12,2,150],['hipthrust',3,8,12,2,120],['bulgarian',2,8,12,2,90],['beinbeuger_sitz',3,10,15,1,90],['wade_sitz',3,12,15,1,60],['beinheben',3,10,15,1,60]]],
  ]},
  gk: { name:'Ganzkörper', desc:'2–3× pro Woche · ideal für Einsteiger', days:[
    ['Ganzkörper A',[['beinpresse',3,8,12,2,150],['brustpresse',3,8,12,2,120],['latzug',3,8,12,2,120],['beinbeuger_sitz',2,10,15,1,90],['schulterpresse',2,8,12,2,90],['crunch_masch',2,10,15,1,60]]],
    ['Ganzkörper B',[['kniebeuge_mp',3,6,10,2,150],['rudern_masch',3,8,12,2,120],['schraeg_kh',3,8,12,2,120],['beinstrecker',2,12,15,1,90],['seitheben_kabel',2,12,15,1,60],['curl_kabel',2,10,12,1,60],['trizeps_kabel',2,10,12,1,60]]],
  ]},
};

/* ============ State ============ */
function freshState() {
  return { version: 1, exercises: DEFAULT_EX.map(e => ({...e})), plans: [], activePlanId: null, workouts: [], current: null,
           settings: { rest: 120, sound: true } };
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.version) {
      // neue Standardübungen ergänzen
      const ids = new Set(d.exercises.map(e => e.id));
      DEFAULT_EX.forEach(e => { if (!ids.has(e.id)) d.exercises.push({...e}); });
      d.settings = Object.assign({ rest: 120, sound: true }, d.settings);
      return d;
    }
  } catch (e) {}
  const s = freshState();
  const p = planFromTemplate('ppl'); s.plans.push(p); s.activePlanId = p.id;
  return s;
}
let S;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('⚠️ Speichern fehlgeschlagen'); } }
function planFromTemplate(key) {
  const t = TEMPLATES[key];
  return { id: uid(), name: t.name, days: t.days.map(([name, items]) => ({ id: uid(), name,
    items: items.map(([exId, sets, repMin, repMax, rir, rest]) => ({ id: uid(), exId, sets, repMin, repMax, rir, rest })) })) };
}
const exById = id => S.exercises.find(e => e.id === id) || { id, name: 'Unbekannte Übung', muscle: '—', equip: '', inc: 2.5, sec: [] };

/* ============ Progression ============ */
function lastPerf(exId, beforeWorkoutId) {
  for (let i = S.workouts.length - 1; i >= 0; i--) {
    const w = S.workouts[i]; if (w.id === beforeWorkoutId) continue;
    const en = w.entries.find(e => e.exId === exId && e.sets.length);
    if (en) return { date: w.end || w.start, sets: en.sets };
  }
  return null;
}
function suggest(exId, t) {
  const ex = exById(exId), inc = ex.inc || 0;
  const last = lastPerf(exId);
  if (!last) return { w: null, r: t.repMax, cls: '', text: `Erstes Mal: Wähle ein Gewicht, mit dem du <b>${t.repMin}–${t.repMax} Wdh.</b> bei RIR ${t.rir} schaffst.` };
  const sets = last.sets.filter(s => s.r != null);
  if (!sets.length) return { w: null, r: t.repMax, cls: '', text: '' };
  const topW = Math.max(...sets.map(s => s.w || 0));
  const top = sets.filter(s => (s.w || 0) === topW);
  const reps = top.map(s => s.r);
  const minR = Math.min(...reps);
  const allMax = top.length >= Math.min(t.sets, sets.length) && reps.every(r => r >= t.repMax);
  if (allMax && inc > 0) {
    const w = roundTo(topW + inc, inc < 1 ? 0.25 : 0.5);
    return { w, r: t.repMin, cls: 'up', text: `↑ <b>${fmtKg(w)} × ${t.repMin}–${t.repMax}</b> · letztes Mal alle Sätze ≥ ${t.repMax} Wdh. → +${fmtN(inc)} kg` };
  }
  if (allMax) return { w: topW || null, r: t.repMax + 1, cls: 'up', text: `↑ Obergrenze erreicht – versuche <b>${t.repMax + 1}+ Wdh.</b>` };
  if (reps.every(r => r < t.repMin - 1) && inc > 0 && topW - inc > 0) {
    const w = roundTo(topW - inc, inc < 1 ? 0.25 : 0.5);
    return { w, r: t.repMin, cls: 'down', text: `↓ Unter dem Wdh.-Bereich – <b>${fmtKg(w)}</b> und sauber ${t.repMin}–${t.repMax} Wdh.` };
  }
  const target = Math.min(t.repMax, Math.max(t.repMin, minR + 1));
  return { w: topW || null, r: target, cls: '', text: `→ <b>${topW ? fmtKg(topW) : 'Gleiches Gewicht'}</b> halten, Ziel: <b>${target}+ Wdh.</b> pro Satz` };
}
function bestE1rm(exId, excludeId) {
  let b = 0;
  S.workouts.forEach(w => { if (w.id === excludeId) return; w.entries.forEach(e => { if (e.exId === exId) e.sets.forEach(s => { b = Math.max(b, e1rm(s.w, s.r, s.rir)); }); }); });
  return b;
}

function nextDay(plan) {
  if (!plan || !plan.days.length) return null;
  const last = [...S.workouts].reverse().find(w => w.planId === plan.id);
  if (!last) return plan.days[0];
  const i = plan.days.findIndex(d => d.id === last.dayId);
  return plan.days[(i + 1) % plan.days.length];
}
function dayMeta(day) {
  const sets = day.items.reduce((a, i) => a + (+i.sets || 0), 0);
  const mins = Math.round(day.items.reduce((a, i) => a + (+i.sets || 0) * ((+i.rest || 90) + 45), 0) / 60);
  return `${day.items.length} Übungen · ${sets} Sätze · ca. ${mins} min`;

  const y = v => H - 22 - (v - min) / span * (H - 40);

  const area = d + `L${x(points.length - 1)},${H - 22}L${x(0)},${H - 22}Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">

    ${points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.y)}" r="3" fill="#ff6a3d"/>`).join('')}
    <text x="${P}" y="${H-5}" fill="#6b6b7e" font-size="10">${new Date(points[0].t).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}</text>
    <text x="${W-10}" y="${H-5}" fill="#6b6b7e" font-size="10" text-anchor="end">${new Date(points[points.length-1].t).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}</text>

}

    <button class="btn danger block" data-a="delWo" data-w="${w.id}">Training löschen</button>`;
}

/* ============ Workout ============ */
function makeEntry(exId, t) {
  const sg = suggest(exId, t);
  const last = lastPerf(exId);
  return { id: uid(), exId, t, sugg: sg, prev: last ? last.sets.map(s => `${fmtN(s.w)}×${s.r}`) : [],
    sets: Array.from({ length: Math.max(1, +t.sets || 1) }, () => ({ w: sg.w != null ? fmtN(sg.w) : '', r: '', rir: '', done: false })) };
}
function startWorkout(planId, dayId) {
  const p = planById(planId), d = p && p.days.find(x => x.id === dayId);
  S.current = { id: uid(), planId: planId || null, dayId: dayId || null, name: d ? d.name : 'Freies Training', start: Date.now(), timer: null,
    entries: d ? d.items.map(it => makeEntry(it.exId, { sets: +it.sets, repMin: +it.repMin, repMax: +it.repMax, rir: +it.rir, rest: +it.rest })) : [] };
  ui.woOpen = true; save(); render(); unlockAudio();
}
function renderWorkout() {
  const root = $('#woRoot'); const c = S.current;
  if (!c || !ui.woOpen) { root.innerHTML = ''; return; }
  const sc = $('#woscroll'), top = sc ? sc.scrollTop : 0;
  const done = c.entries.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0), all = c.entries.reduce((a, e) => a + e.sets.length, 0);
  let h = `<div id="wo"><div class="wohead"><button class="back" data-a="minWo">⌄</button>
    <div class="ttl"><b>${esc(c.name)}</b><span class="small muted"><span id="woClock">${fmtClock((Date.now() - c.start) / 1000)}</span> · ${done}/${all} Sätze</span></div>
    <button class="btn sm" data-a="finishWo">Fertig</button></div><div id="woscroll">`;
  c.entries.forEach((e, ei) => {
    const ex = exById(e.exId), t = e.t;
    h += `<div class="card"><div class="row"><div class="grow"><div class="exname">${esc(ex.name)}</div>
      <div class="small muted">${t.sets}× ${t.repMin}–${t.repMax} Wdh. · RIR ${t.rir} · Pause ${fmtClock(t.rest)}</div></div>
      <button class="iconbtn" data-a="exMenu" data-e="${ei}">⋯</button></div>
      ${e.sugg.text ? `<div class="sugg ${e.sugg.cls}">${e.sugg.text}</div>` : ''}
      <div class="sgrid h"><span>Satz</span><span>Zuletzt</span><span>kg</span><span>Wdh</span><span>RIR</span><span></span></div>`;
    e.sets.forEach((s, si) => {
      h += `<div class="sgrid srow ${s.done ? 'done' : ''}"><span class="sn">${si + 1}</span><span class="prev">${esc(e.prev[si] || '–')}</span>
        <input inputmode="decimal" data-f="set" data-k="w" data-e="${ei}" data-s="${si}" value="${esc(s.w)}" placeholder="kg">
        <input inputmode="numeric" data-f="set" data-k="r" data-e="${ei}" data-s="${si}" value="${esc(s.r)}" placeholder="${e.sugg.r || t.repMax}">
        <input inputmode="numeric" data-f="set" data-k="rir" data-e="${ei}" data-s="${si}" value="${esc(s.rir)}" placeholder="${t.rir}">
        <button class="chk" data-a="toggleSet" data-e="${ei}" data-s="${si}">✓</button></div>`;
    });
    h += `<div class="row" style="margin-top:8px;gap:8px"><button class="btn ghost sm" data-a="addSet" data-e="${ei}">+ Satz</button>
      ${e.sets.length > 1 ? `<button class="btn ghost sm" style="color:var(--tx3)" data-a="delSet" data-e="${ei}">− Satz</button>` : ''}</div></div>`;
  });
  h += `<button class="btn sec block" data-a="woAddEx">+ Übung hinzufügen</button>
    <button class="btn ghost block" style="color:var(--bad);margin-top:10px" data-a="cancelWo">Training verwerfen</button></div></div>`;
  h += timerHTML();
  root.innerHTML = h;
  const ns = $('#woscroll'); if (ns) ns.scrollTop = top;
}
function timerHTML() {
  const t = S.current && S.current.timer; if (!t) return '';
  const left = (t.end - Date.now()) / 1000, over = left <= 0;
  return `<div class="timer ${over ? 'over' : ''}" id="timer"><span class="t" id="timerT">${over ? '+' + fmtClock(-left) : fmtClock(left)}</span>
    <div class="bar"><i id="timerBar" style="width:${over ? 100 : Math.max(0, 100 - left / t.total * 100)}%;${over ? 'background:var(--ok)' : ''}"></i></div>
    <button class="iconbtn" data-a="timerAdd" data-k="-15">−15</button><button class="iconbtn" data-a="timerAdd" data-k="15">+15</button><button class="iconbtn" data-a="timerStop">✕</button></div>`;
}
function startTimer(sec) { S.current.timer = { end: Date.now() + sec * 1000, total: sec, beeped: false }; save(); }
let audioCtx = null;
function unlockAudio() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {} }
function beep() {
  if (!S.settings.sound || !audioCtx) return;
  try { [0, .25, .5].forEach(d => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    const t0 = audioCtx.currentTime + d; g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.4, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .18); o.start(t0); o.stop(t0 + .2); }); } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
setInterval(() => {
  const c = S && S.current; if (!c || !ui.woOpen) return;
  const clk = $('#woClock'); if (clk) clk.textContent = fmtClock((Date.now() - c.start) / 1000);
  const t = c.timer; if (!t) return;
  const left = (t.end - Date.now()) / 1000, el = $('#timer');
  if (!el) return;
  if (left <= 0 && !t.beeped) { t.beeped = true; save(); beep(); }
  el.classList.toggle('over', left <= 0);
  $('#timerT').textContent = left <= 0 ? '+' + fmtClock(-left) : fmtClock(left);
  const b = $('#timerBar'); b.style.width = (left <= 0 ? 100 : Math.max(0, 100 - left / t.total * 100)) + '%'; b.style.background = left <= 0 ? 'var(--ok)' : '';
}, 250);

function finishWorkout() {
  const c = S.current;
  const entries = c.entries.map(e => ({ exId: e.exId, t: e.t,
    sets: e.sets.filter(s => s.done).map(s => ({ w: num(s.w) || 0, r: num(s.r) || 0, rir: num(s.rir) })) })).filter(e => e.sets.length);
  if (!entries.length) { if (confirm('Keine abgeschlossenen Sätze. Training verwerfen?')) { S.current = null; ui.woOpen = false; save(); render(); } return; }
  const w = { id: c.id, planId: c.planId, dayId: c.dayId, name: c.name, start: c.start, end: Date.now(), entries };
  const prs = entries.filter(e => { const b = bestE1rm(e.exId); const now = Math.max(...e.sets.map(s => e1rm(s.w, s.r, s.rir))); return b > 0 && now > b + 0.01; });
  S.workouts.push(w); S.current = null; ui.woOpen = false; save(); render();
  const vol = entries.reduce((b, e) => b + e.sets.reduce((c2, s) => c2 + s.w * s.r, 0), 0);
  openSheet(`<div style="text-align:center;padding:10px 0 4px"><div style="font-size:48px">🏆</div><h2 style="margin:6px 0 2px">Starkes Training!</h2><div class="muted">${esc(w.name)}</div></div>
    <div class="stats" style="margin-top:14px"><div class="stat"><b>${fmtDur(w.end - w.start)}</b><span>Dauer</span></div><div class="stat"><b>${entries.reduce((a, e) => a + e.sets.length, 0)}</b><span>Sätze</span></div><div class="stat"><b>${Math.round(vol)}</b><span>kg Volumen</span></div></div>
    ${prs.length ? `<div class="card"><div class="pr" style="margin-bottom:6px">⭐ Neue Rekorde (e1RM)</div>${prs.map(e => `<div class="small">${esc(exById(e.exId).name)}</div>`).join('')}</div>` : ''}
    <button class="btn block" data-a="closeSheet">Schließen</button>`);
}

/* ============ Sheet / Toast ============ */

function closeSheet() { $('#sheet').classList.remove('on'); $('#sheetbg').classList.remove('on'); sheetCb = null; }
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
function menu(items) { // items: [label, fn, red?]

/* ============ Aktionen ============ */
const curPlan = () => planById(ui.planId);
const curDay = () => { const p = curPlan(); return p && p.days.find(d => d.id === ui.dayId); };
const move = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
const scrollTop = () => { $('#view').scrollTop = 0; };

const A = {

  closeSheet,
  menuPick: el => { const it = sheetCb && sheetCb[+el.dataset.i]; closeSheet(); if (it) it[1](); },
  start: el => { if (S.current) return toast('Es läuft bereits ein Training'); startWorkout(el.dataset.p, el.dataset.d); },
  startFree: () => startWorkout(null, null),
  openWo: () => { ui.woOpen = true; render(); },
  minWo: () => { ui.woOpen = false; render(); },

  finishWo: () => {
    const open = S.current.entries.reduce((a, e) => a + e.sets.filter(s => !s.done).length, 0);

    finishWorkout();
  },
  toggleSet: el => {
    unlockAudio();
    const e = S.current.entries[+el.dataset.e], s = e.sets[+el.dataset.s];
    if (!s.done) {
      if (s.r === '') s.r = String(e.sugg.r || e.t.repMax);
      if (s.rir === '') s.rir = String(e.t.rir);
      if (s.w === '' && e.sugg.w != null) s.w = fmtN(e.sugg.w);
      s.done = true;
      // Gewicht auf folgende offene Sätze übertragen
      for (let i = +el.dataset.s + 1; i < e.sets.length; i++) if (!e.sets[i].done) e.sets[i].w = s.w;
      startTimer(e.t.rest || S.settings.rest);
    } else s.done = false;
    save(); renderWorkout();
  },
  addSet: el => { const e = S.current.entries[+el.dataset.e]; const l = e.sets[e.sets.length - 1]; e.sets.push({ w: l ? l.w : '', r: '', rir: '', done: false }); save(); renderWorkout(); },
  delSet: el => { const e = S.current.entries[+el.dataset.e]; if (e.sets.length > 1) e.sets.pop(); save(); renderWorkout(); },
  timerAdd: el => { const t = S.current.timer; if (!t) return; t.end += (+el.dataset.k) * 1000; t.total = Math.max(1, t.total + (+el.dataset.k)); if (t.end > Date.now()) t.beeped = false; save(); },
  timerStop: () => { S.current.timer = null; save(); renderWorkout(); },
  woAddEx: () => pickExercise(id => {

  pickEx: el => { const cb = sheetCb; if (typeof cb === 'function') cb(el.dataset.x); },

  dayUp: el => { move(curPlan().days, +el.dataset.i, -1); save(); render(); },

  export: async () => {

  },
  import: () => $('#importFile').click(),
  reset: () => { if (confirm('Wirklich ALLE Daten (Pläne, Trainings, eigene Übungen) löschen?') && confirm('Sicher? Das kann nicht rückgängig gemacht werden.')) { localStorage.removeItem(KEY); S = load(); ui.tab = 'train'; render(); } },
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  if (el.disabled) return;
  const fn = A[el.dataset.a]; if (fn) { ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('input', ev => {
  const el = ev.target, f = el.dataset && el.dataset.f; if (!f) return;
  if (f === 'set') { const s = S.current.entries[+el.dataset.e].sets[+el.dataset.s]; s[el.dataset.k] = el.value.replace(/[^\d.,]/g, ''); save(); return; }
  if (f === 'item') { curDay().items[+el.dataset.i][el.dataset.k] = Math.max(0, parseInt(el.value) || 0); save(); return; }
  if (f === 'planName') { curPlan().name = el.value; save(); return; }
  if (f === 'dayName') { curDay().name = el.value; save(); return; }
  if (f === 'setRest') { S.settings.rest = Math.max(0, parseInt(el.value) || 0); save(); return; }
  if (f === 'exSearch') { ui.exSearch = el.value; const pos = el.selectionStart; render(); const n = $('[data-f="exSearch"]'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} return; }
  if (f === 'pickQ') { ui.pickQ = el.value; renderPick(); return; }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.f === 'statEx') { ui.statEx = el.value; render(); }
  if (el.id === 'importFile' && el.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try { const d = JSON.parse(r.result); if (!d.version || !Array.isArray(d.workouts)) throw 0;
        if (!confirm(`Backup mit ${d.workouts.length} Trainings und ${d.plans.length} Plänen laden? Aktuelle Daten werden ersetzt.`)) return;
        localStorage.setItem(KEY, JSON.stringify(d)); S = load(); render(); toast('Backup importiert');
      } catch (e) { toast('Ungültige Backup-Datei'); }
    };
    r.readAsText(el.files[0]); el.value = '';
  }
});
// Enter springt zum nächsten Feld im Training
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || !ev.target.matches('#wo input')) return;
  ev.preventDefault(); const ins = [...document.querySelectorAll('#wo input')]; const n = ins[ins.indexOf(ev.target) + 1]; if (n) n.focus(); else ev.target.blur();
});

/* ============ Start ============ */
S = load(); save();
if (S.current) ui.woOpen = true;
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
