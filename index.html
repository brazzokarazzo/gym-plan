<html lang="de">
<head>

<script>/* Theme früh setzen: kein Aufblitzen, passende iOS-Statusleiste */
try { const t = (JSON.parse(localStorage.getItem('gymplan-v1') || '{}').settings || {}).theme || 'auto';
  const light = t === 'light' || (t === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  if (light) { document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = 'default'; document.querySelector('meta[name="theme-color"]').content = '#f2f2f7'; }
} catch (e) {}</script>

<title>Gym Plan</title>
<style>
:root{
  --bg:#0b0b0f; --bg2:#15151c; --bg3:#1f1f29; --line:#2a2a36;
  --tx:#f4f4f8; --tx2:#a0a0b2; --tx3:#6b6b7e;
  --acc:#ff6a3d; --acc2:#ff8f5e; --accbg:rgba(255,106,61,.14);
  --ok:#34c759; --okbg:rgba(52,199,89,.15); --warn:#ffcc00; --bad:#ff453a;
  --r:16px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --bar:rgba(18,18,24,.92); color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f2f7; --bg2:#ffffff; --bg3:#e9e9ef; --line:#d6d6de;
  --tx:#111116; --tx2:#5c5c6b; --tx3:#8e8e9c;
  --acc:#e8551f; --acc2:#ff6a3d; --accbg:rgba(232,85,31,.12);
  --ok:#1f9d44; --okbg:rgba(31,157,68,.13); --warn:#b38600; --bad:#d70015;
  --bar:rgba(255,255,255,.92); color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--tx);background:var(--bg3);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--acc)}
input::placeholder{color:var(--tx3)}
h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-.5px}
h2{font-size:20px;margin:22px 0 10px;font-weight:700}
h3{font-size:17px;margin:0;font-weight:650}
.muted{color:var(--tx2)} .small{font-size:13px} .tiny{font-size:11px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 96px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.back{color:var(--acc);font-weight:600;font-size:17px;display:flex;align-items:center;gap:4px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bar);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);
  padding:6px 4px calc(var(--sb) + 6px);z-index:10}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--tx3);padding:4px 0}
.tabbar button.on{color:var(--acc)}
.tabbar svg{width:25px;height:25px}

.card{background:var(--bg2);border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--acc);color:#fff;font-weight:650;
  border-radius:12px;padding:12px 16px;font-size:16px}
.btn:active{opacity:.75}
.btn.sec{background:var(--bg3);color:var(--tx)}
.btn.ghost{background:transparent;color:var(--acc);padding:8px 6px}
.btn.danger{background:rgba(255,69,58,.15);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--bg3);color:var(--tx2);font-size:12px;font-weight:600}
.pill.acc{background:var(--accbg);color:var(--acc)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.chev{color:var(--tx3);font-size:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--bg3);color:var(--tx2);font-size:14px;font-weight:600}
.chip.on{background:var(--acc);color:#fff}
.chips.area .chip{background:transparent;border:1px solid var(--line);padding:6px 12px}
.chips.area .chip.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
.chips.cat .chip{background:transparent;border:1px dashed var(--line);padding:6px 12px}
.chips.cat .chip.on{background:var(--tx);color:var(--bg);border:1px solid var(--tx)}
.hnpill{color:var(--acc);font-weight:600}
.hero{background:linear-gradient(135deg,#ff6a3d,#c2185b);border:0;color:#fff}
.hero .muted{color:rgba(255,255,255,.8)}
.hero .btn{background:#fff;color:#c2185b}
.ubars{display:flex;gap:3px;align-items:flex-end;margin-top:14px}
.ucol{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.uval{font-size:9px;color:var(--tx3);height:12px}
.utrack{position:relative;width:100%;height:130px;background:var(--bg3);border-radius:5px;overflow:hidden}
.ubar{position:absolute;left:0;right:0;bottom:0;border-radius:5px 5px 0 0;opacity:.85}
.ucol.cur .utrack{outline:2px solid var(--acc);outline-offset:1px}
.ucol.cur .ubar{opacity:1}
.uprev{position:absolute;left:-1px;right:-1px;height:2px;background:var(--tx);opacity:.7}
.uleg{display:inline-block;width:12px;height:2px;background:var(--tx);opacity:.7;vertical-align:middle}
.ulbl{font-size:10px;color:var(--tx3);height:14px;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12px;color:var(--tx2)}
.empty{text-align:center;color:var(--tx2);padding:30px 10px}
.ico{width:40px;height:40px;border-radius:12px;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}

/* bars */
.bar{height:8px;background:var(--bg3);border-radius:9px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:9px;background:var(--acc)}
.bar .zone{position:absolute;top:0;bottom:0;background:rgba(52,199,89,.18)}

/* plan editor */
.pitem{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.pgrid label{font-size:10.5px;color:var(--tx2);display:block;text-align:center;margin-bottom:3px}
.pgrid input{text-align:center;padding:7px 2px}
.iconbtn{width:34px;height:34px;border-radius:10px;background:var(--bg3);display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);font-size:16px;flex:none}

/* workout */
#wo{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.wohead{padding:calc(var(--st) + 8px) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.wohead .ttl{text-align:center;flex:1;min-width:0}
.wohead .ttl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#woscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(var(--sb) + 120px)}
.exname{font-size:17px;font-weight:700}
.sugg{margin:10px 0 6px;padding:8px 10px;border-radius:10px;background:var(--bg3);font-size:13px;color:var(--tx2)}
.sugg.up{background:var(--okbg);color:var(--ok)}
.sugg.down{background:rgba(255,204,0,.12);color:var(--warn)}
.sugg b{color:var(--tx)}
.sgrid{display:grid;grid-template-columns:30px 1fr 64px 52px 46px 40px;gap:6px;align-items:center}
.sgrid.h{font-size:11px;color:var(--tx3);font-weight:600;text-transform:uppercase;margin:8px 0 4px;letter-spacing:.3px}
.sgrid.h span{text-align:center}
.sgrid.c{grid-template-columns:30px 1fr 72px 72px 40px}
.srow{padding:4px 0;border-radius:10px}
.srow input{text-align:center;padding:8px 2px;font-weight:600}
.srow .sn{text-align:center;font-weight:700;color:var(--tx2)}
.srow .prev{text-align:center;color:var(--tx3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow.done{background:var(--okbg)}
.srow.done input{background:transparent;border-color:transparent;color:var(--ok)}
.chk{width:40px;height:36px;border-radius:10px;background:var(--bg3);color:var(--tx3);font-size:18px;font-weight:800}
.srow.done .chk{background:var(--ok);color:#fff}
.timer{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 12px);z-index:25;background:var(--bg3);border:1px solid var(--line);
  border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.timer .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:74px}
.timer .bar{flex:1}
.timer.over{border-color:var(--ok)} .timer.over .t{color:var(--ok)}

/* sheet */
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#sheetbg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg2);border-radius:20px 20px 0 0;max-height:88vh;
  display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;border-top:1px solid var(--line)}
#sheet.on{transform:none}
#sheet .grab{width:38px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 2px}
#sheet .shead{position:relative;flex:none;min-height:30px}
#sheet .sclose{position:absolute;top:8px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--bg3);color:var(--tx2);font-size:15px;line-height:32px;text-align:center;z-index:1}
#sheetc{overflow-y:auto;padding:8px 16px calc(var(--sb) + 18px);-webkit-overflow-scrolling:touch}
.menu button{display:block;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-size:17px}
.menu button:last-child{border-bottom:0}
.menu button.red{color:var(--bad)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--tx2);margin-bottom:5px}
#toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translate(-50%,-120px);background:var(--bg3);border:1px solid var(--line);
  padding:10px 16px;border-radius:12px;z-index:60;transition:transform .25s;font-weight:600;font-size:14px;max-width:90vw}
#toast.on{transform:translate(-50%,0)}
svg.chart{width:100%;height:auto;display:block}
.pr{color:var(--warn);font-weight:700}
a.iconbtn{text-decoration:none}
.imglinks{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.thumb{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;background:#fff;border-radius:14px;margin:0 0 10px}
/* Foto-Layer */
#photo{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.94);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .2s}
#photo.on{opacity:1;pointer-events:auto}
#photo .ph{display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 10px) 16px 10px}
#photo .ph b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
#photo .close{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);font-size:18px;color:#fff;flex:none}
#photo .slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#photo .slides::-webkit-scrollbar{display:none}
#photo .slide{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:0 12px}
#photo .slide img{max-width:100%;max-height:100%;background:#fff;border-radius:16px;object-fit:contain}
#photo .slide .miss{color:var(--tx2);text-align:center;padding:30px;font-size:14px}
#photo .dots{display:flex;justify-content:center;gap:7px;padding:12px}
#photo .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}
#photo .dots i.on{background:#fff}
#photo .pf{padding:0 16px calc(var(--sb) + 14px);text-align:center;font-size:12px;color:var(--tx3)}
.imglinks button, .imglinks a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 8px;border-radius:12px;background:var(--accbg);color:var(--acc);font-weight:650;font-size:14px;text-decoration:none}
.imglinks a.sec{background:var(--bg3);color:var(--tx)}
</style>
</head>

<input type="file" id="planFile" accept="application/json,.json" style="display:none">

  <div class="slides" id="phSlides"></div><div class="dots" id="phDots"></div><div class="pf" id="phFoot"></div></div>

<script>
'use strict';
/* ============ Basis ============ */
const KEY = 'gymplan-v1';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const fmtN = n => n == null ? '' : (Math.round(n * 100) / 100).toString().replace('.', ',');
const fmtKg = n => fmtN(n) + ' kg';
const roundTo = (n, step) => Math.round(n / step) * step;
const e1rm = (w, r, rir) => (w > 0 && r > 0) ? w * (1 + (r + (rir || 0)) / 30) : 0;
const DAY = 864e5;
const fmtDur = ms => { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m/60)} h ${m%60} min` : `${m} min`; };
const fmtClock = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const fmtDate = t => new Date(t).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: '2-digit' });
const weekStart = (t = Date.now()) => { const d = new Date(t); d.setHours(0,0,0,0); const wd = (d.getDay() + 6) % 7; return d.getTime() - wd * DAY; };

const STRENGTH_MUSCLES = ['Brust','Rücken','Schultern','Bizeps','Trizeps','Quadrizeps','Beinbeuger','Gesäß','Waden','Bauch','Unterer Rücken'];
const MUSCLES = [...STRENGTH_MUSCLES, 'Variabel', 'Cardio'];
const EQUIP = ['Maschine','Scheibenmaschine','Kabelzug','Freihantel-Station','Bank','Cardiogerät'];
const isCardio = ex => !!ex && ex.muscle === 'Cardio';
/* Standardwerte für neue Übungen im Plan bzw. Training */
const DEF_T = () => ({ sets: 3, repMin: 8, repMax: 12, rir: 2, rest: S.settings.rest, minutes: 15, level: 8 });
const fullT = t => Object.assign(DEF_T(), ...Object.entries(t || {}).filter(([, v]) => v != null && !Number.isNaN(v)).map(([k, v]) => ({ [k]: v })));
const fmtCardio = s => `Stufe ${fmtN(s.lvl)} · ${fmtN(s.min)} min`;

/* Übungsbibliothek – nur Geräte. McFit-Studios sind mit gym80 ausgestattet;
   g80 = gym80-Produktnummer (Seite mit Fotos des Geräts), q = Suchbegriff für Fotos aus McFit-Studios.
   Je nach Studio können einzelne Modelle abweichen. */
/* Trainingsbereiche im McFit Heilbronn ("HN" = gibt es in Heilbronn) */
const AB = 'Basic Bereich', AF = 'Freihantelbereich', AU = 'Functionalbereich', AC = 'Cardiobereich';

const AREA_SHORT = { [AB]: 'Basic', [AF]: 'Freihantel', [AU]: 'Functional', [AC]: 'Cardio' };
/* Gerätekategorie laut Geräteliste McFit Heilbronn (Spalte „Kategorie“) */
const CATS = ['Brust', 'Rücken', 'Schultern', 'Arme', 'Beine', 'Core'];
const DEV_CAT = {
  hyperext:'Rücken', bauchbank:'Core', adduktor:'Beine', abduktor:'Beine', beinbeuger_liegend:'Beine', beinstrecker:'Beine',
  wade_steh:'Beine', beinpresse:'Beine', reverse_fly:'Schultern', butterfly:'Brust', latzug_masch:'Rücken', rudern_masch:'Rücken',
  brustpresse:'Brust', nacken:'Schultern', seilzug_explosiv:'Core', rueckenstrecker:'Rücken', crunch_masch:'Core', crunch_masch2:'Core',
  bauch_liegend:'Core', multipresse:'Beine', bootybooster:'Beine', turm4:'Rücken', powerrack:'Beine', vstation:'Arme',
  kabel_doppelt:'Brust', seitheben_pk:'Schultern', curl_dual:'Arme', high_row:'Rücken', low_row:'Rücken', bank_dual:'Brust',

  pivot_bp:'Beine', beinpresse_45:'Beine', belt_squat:'Beine', kniebeuge_masch:'Beine', reverse_hyper:'Rücken',
  wade_sitz_pk:'Beine', tbar:'Rücken',
  // Griff-Varianten erben die Kategorie ihres Geräts
  latzug_ug:'Rücken', rudern_ug:'Rücken', brust_eng:'Brust', nacken_eng:'Schultern',
};
const DEFAULT_EX = [
  // Brust
  ['brustpresse','HN Brustpresse','Brust','Maschine',5,['Trizeps','Schultern'],'3016',[AB]],
  ['bank_dual','HN Bankdrücken Dual','Brust','Scheibenmaschine',2.5,['Trizeps','Schultern'],'4331',[AF]],

  ['brust_pk','Brustpresse Plate-Loaded','Brust','Scheibenmaschine',2.5,['Trizeps','Schultern'],'4328'],
  // Rücken
  ['latzug_masch','HN Latzug','Rücken','Maschine',5,['Bizeps'],'3020',[AB, AF]],
  ['rudern_masch','HN Rudermaschine sitzend','Rücken','Maschine',5,['Bizeps'],'3040',[AB]],
  ['high_row','HN High-Row','Rücken','Scheibenmaschine',2.5,['Bizeps'],'4340',[AF]],
  ['low_row','HN Low Row','Rücken','Scheibenmaschine',2.5,['Bizeps'],'4319',[AF]],
  ['tbar','HN T-Bar-Rudern','Rücken','Scheibenmaschine',2.5,['Bizeps'],'4018',[AF]],
  ['rueckenstrecker','HN Rückenstrecker','Unterer Rücken','Maschine',5,['Gesäß'],'3007',[AB]],
  ['hyperext','HN Hyperextension','Unterer Rücken','Bank',2.5,['Gesäß','Beinbeuger'],'4119',[AU]],
  ['latzug_dual','Latzugmaschine Dual (einarmig möglich)','Rücken','Maschine',5,['Bizeps'],'3044'],
  ['iso_lat','Iso-Lat (Latzug Plate-Loaded)','Rücken','Scheibenmaschine',2.5,['Bizeps'],'3047'],

function freshState() {
  return { version: 3, exercises: DEFAULT_EX.map(e => ({...e})), plans: [], activePlanId: null, workouts: [], current: null,
           settings: { rest: 120, sound: true } };
}
function migrate(d) {
  const defIds = new Set(DEFAULT_EX.map(e => e.id));
  const used = new Set(d.workouts.flatMap(w => w.entries.map(e => e.exId)));
  if (d.current) d.current.entries.forEach(e => used.add(e.exId));
  if (d.version < 2) {
    // Hantel-Übungen in Plänen durch Geräte ersetzen
    d.plans.forEach(p => p.days.forEach(day => day.items.forEach(it => { if (LEGACY_MAP[it.exId]) it.exId = LEGACY_MAP[it.exId]; })));
    // alte Standardübungen: behalten nur, wenn Verlauf vorhanden (dann ausgeblendet)
    d.exercises = d.exercises.filter(e => e.custom || defIds.has(e.id) || used.has(e.id));
    d.exercises.forEach(e => { if (!e.custom && !defIds.has(e.id)) e.legacy = true; });
    d.version = 2;
  }
  if (d.version < 3) {
    // Kabelzug-Übungen in Plänen durch Maschinen ersetzen (ohne Doppelungen am selben Tag)
    d.plans.forEach(p => p.days.forEach(day => day.items.forEach(it => {
      const alts = CABLE_MAP[it.exId]; if (!alts) return;
      it.exId = alts.find(a => !day.items.some(o => o.exId === a)) || alts[0];
    })));
    d.version = 3;
  }
  // nicht mehr enthaltene Standardübungen: nur mit Verlauf behalten (ausgeblendet)
  d.exercises = d.exercises.filter(e => e.custom || defIds.has(e.id) || used.has(e.id));
  d.exercises.forEach(e => { if (!e.custom) e.legacy = !defIds.has(e.id); });
  // Standardübungen aktualisieren/ergänzen (eigene Steigerung bleibt erhalten)
  DEFAULT_EX.forEach(def => {
    const cur = d.exercises.find(e => e.id === def.id);
    if (cur) Object.assign(cur, { name: def.name, muscle: def.muscle, equip: def.equip, sec: def.sec, g80: def.g80, area: def.area, hn: def.hn, cat: def.cat });
    else d.exercises.push({...def});
  });
  d.settings = Object.assign({ rest: 120, sound: true }, d.settings);
  return d;
}

/* ============ Progression ============ */
function lastPerf(exId, beforeWorkoutId) {
  for (let i = S.workouts.length - 1; i >= 0; i--) {
    const w = S.workouts[i]; if (w.id === beforeWorkoutId) continue;
    const en = w.entries.find(e => e.exId === exId && e.sets.length);
    if (en) return { date: w.end || w.start, sets: en.sets };
  }
  return null;
}
function suggest(exId, t) {
  const ex = exById(exId), inc = ex.inc || 0;
  const last = lastPerf(exId);
  if (!last) return { w: null, r: t.repMax, cls: '', text: `Erstes Mal: Wähle ein Gewicht, mit dem du <b>${t.repMin}–${t.repMax} Wdh.</b> bei RIR ${t.rir} schaffst.` };
  const sets = last.sets.filter(s => s.r != null);
  if (!sets.length) return { w: null, r: t.repMax, cls: '', text: '' };
  const topW = Math.max(...sets.map(s => s.w || 0));
  const top = sets.filter(s => (s.w || 0) === topW);
  const reps = top.map(s => s.r);
  const minR = Math.min(...reps);
  const allMax = top.length >= Math.min(t.sets, sets.length) && reps.every(r => r >= t.repMax);
  if (allMax && inc > 0) {
    const w = roundTo(topW + inc, inc < 1 ? 0.25 : 0.5);
    return { w, r: t.repMin, cls: 'up', text: `↑ <b>${fmtKg(w)} × ${t.repMin}–${t.repMax}</b> · letztes Mal alle Sätze ≥ ${t.repMax} Wdh. → +${fmtN(inc)} kg` };
  }
  if (allMax) return { w: topW || null, r: t.repMax + 1, cls: 'up', text: `↑ Obergrenze erreicht – versuche <b>${t.repMax + 1}+ Wdh.</b>` };
  if (reps.every(r => r < t.repMin - 1) && inc > 0 && topW - inc > 0) {
    const w = roundTo(topW - inc, inc < 1 ? 0.25 : 0.5);
    return { w, r: t.repMin, cls: 'down', text: `↓ Unter dem Wdh.-Bereich – <b>${fmtKg(w)}</b> und sauber ${t.repMin}–${t.repMax} Wdh.` };
  }
  const target = Math.min(t.repMax, Math.max(t.repMin, minR + 1));
  return { w: topW || null, r: target, cls: '', text: `→ <b>${topW ? fmtKg(topW) : 'Gleiches Gewicht'}</b> halten, Ziel: <b>${target}+ Wdh.</b> pro Satz` };
}
function bestE1rm(exId, excludeId) {
  let b = 0;
  S.workouts.forEach(w => { if (w.id === excludeId) return; w.entries.forEach(e => { if (e.exId === exId) e.sets.forEach(s => { b = Math.max(b, e1rm(s.w, s.r, s.rir)); }); }); });
  return b;
}

function nextDay(plan) {
  if (!plan || !plan.days.length) return null;
  const last = [...S.workouts].reverse().find(w => w.planId === plan.id);
  if (!last) return plan.days[0];
  const i = plan.days.findIndex(d => d.id === last.dayId);
  return plan.days[(i + 1) % plan.days.length];
}
function dayMeta(day) {
  const str = day.items.filter(i => !isCardio(exById(i.exId))), car = day.items.filter(i => isCardio(exById(i.exId)));
  const sets = str.reduce((a, i) => a + (+i.sets || 0), 0);
  const carMin = car.reduce((a, i) => a + (num(i.minutes) ?? 15), 0);
  const mins = Math.round(str.reduce((a, i) => a + (+i.sets || 0) * ((+i.rest || 90) + 45), 0) / 60 + carMin);
  return `${day.items.length} Übungen · ${sets} Sätze${car.length ? ` · ${carMin} min Cardio` : ''} · ca. ${mins} min`;
}

/* ---------- Übungen ---------- */
function exHistory(exId) {
  const out = [];
  const cardio = isCardio(exById(exId));
  S.workouts.forEach(w => w.entries.forEach(e => { if (e.exId === exId && e.sets.length) {
    if (cardio) {   // Cardio: y = höchste Stufe, dazu Minuten gesamt
      const lvl = Math.max(...e.sets.map(s => s.lvl || 0));
      return out.push({ t: w.start, sets: e.sets, e1: lvl, min: e.sets.reduce((a, s) => a + (s.min || 0), 0), vol: 0 });
    }
    const best = e.sets.reduce((b, s) => e1rm(s.w, s.r, s.rir) > e1rm(b.w, b.r, b.rir) ? s : b, e.sets[0]);
    out.push({ t: w.start, sets: e.sets, best, e1: e1rm(best.w, best.r, best.rir), vol: e.sets.reduce((a, s) => a + (s.w || 0) * (s.r || 0), 0) });
  }}));
  return out;
}

function chartSVG(points, label) {
  if (points.length < 2) return `<div class="empty small">Mindestens 2 Trainings nötig für den Verlauf.</div>`;
  const W = 340, H = 150, P = 28;
  const ys = points.map(p => p.y), min = Math.min(...ys), max = Math.max(...ys), span = (max - min) || 1;
  const x = i => P + i * (W - P - 10) / (points.length - 1);
  const y = v => H - 22 - (v - min) / span * (H - 40);
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
  const area = d + `L${x(points.length - 1)},${H - 22}L${x(0)},${H - 22}Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff6a3d" stop-opacity=".35"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></linearGradient></defs>
    <line x1="${P}" x2="${W-10}" y1="${y(max)}" y2="${y(max)}" style="stroke:var(--line)" stroke-dasharray="3 4"/>
    <line x1="${P}" x2="${W-10}" y1="${y(min)}" y2="${y(min)}" style="stroke:var(--line)" stroke-dasharray="3 4"/>
    <text x="2" y="${y(max)+4}" style="fill:var(--tx2)" font-size="10">${Math.round(max)}</text>
    <text x="2" y="${y(min)+4}" style="fill:var(--tx2)" font-size="10">${Math.round(min)}</text>
    <path d="${area}" fill="url(#g)"/><path d="${d}" fill="none" stroke="#ff6a3d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.y)}" r="3" fill="#ff6a3d"/>`).join('')}
    <text x="${P}" y="${H-5}" style="fill:var(--tx3)" font-size="10">${new Date(points[0].t).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}</text>
    <text x="${W-10}" y="${H-5}" style="fill:var(--tx3)" font-size="10" text-anchor="end">${new Date(points[points.length-1].t).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}</text>
    <text x="${W-10}" y="12" style="fill:var(--tx2)" font-size="10" text-anchor="end">${label}</text></svg>`;
}

/* ---------- Verlauf ---------- */
function vHist() {
  const ws = weekStart(), wk = S.workouts.filter(w => w.start >= ws);
  const vol = wk.reduce((a, w) => a + w.entries.reduce((b, e) => b + e.sets.reduce((c, s) => c + (s.w || 0) * (s.r || 0), 0), 0), 0);
  const last7 = S.workouts.filter(w => w.start >= Date.now() - 7 * DAY);
  const ms = {}; STRENGTH_MUSCLES.forEach(m => ms[m] = 0);
  let carMin = 0;
  last7.forEach(w => w.entries.forEach(e => { const ex = exById(e.exId); const n = e.sets.length;
    if (isCardio(ex)) { carMin += e.sets.reduce((a, s) => a + (s.min || 0), 0); return; }
    if (ms[ex.muscle] != null) ms[ex.muscle] += n; (ex.sec || []).forEach(m => { if (ms[m] != null) ms[m] += n * 0.5; }); }));
  const maxS = Math.max(22, ...Object.values(ms));
  let h = `<div class="top"><h1>Verlauf</h1></div>
    <div class="stats"><div class="stat"><b>${wk.length}</b><span>Trainings Woche</span></div><div class="stat"><b>${vol >= 10000 ? fmtN(Math.round(vol / 100) / 10) + 't' : Math.round(vol)}</b><span>Volumen ${vol >= 10000 ? '' : 'kg'}</span></div><div class="stat"><b>${S.workouts.length}</b><span>Gesamt</span></div></div>
    <div class="card"><div class="row between" style="margin-bottom:10px"><h3>Sätze pro Muskel</h3><span class="tiny muted">letzte 7 Tage · grün = 10–20</span></div>`;
  STRENGTH_MUSCLES.forEach(m => {
    const v = ms[m];
    h += `<div style="margin:9px 0"><div class="row between small"><span>${m}</span><span class="muted">${fmtN(v)}</span></div>
      <div class="bar"><div class="zone" style="left:${10/maxS*100}%;width:${10/maxS*100}%"></div><i style="width:${Math.min(100, v / maxS * 100)}%;${v >= 10 && v <= 20 ? 'background:var(--ok)' : ''}"></i></div></div>`;
  });
  h += `<div class="row between small" style="margin-top:14px;padding-top:10px;border-top:1px solid var(--line)"><span>🚴 Cardio</span><span class="muted">${fmtN(carMin)} min</span></div></div>`;
  const used = [...new Set(S.workouts.flatMap(w => w.entries.map(e => e.exId)))];
  if (used.length) {
    if (!used.includes(ui.statEx)) ui.statEx = used[0];
    h += `<div class="card"><div class="row between" style="margin-bottom:8px"><h3>Entwicklung</h3></div>
      <select data-f="statEx" style="margin-bottom:10px">${used.map(id => `<option value="${id}" ${id === ui.statEx ? 'selected' : ''}>${esc(exById(id).name)}</option>`).join('')}</select>
      ${chartSVG(exHistory(ui.statEx).map(x => ({ t: x.t, y: x.e1 })), isCardio(exById(ui.statEx)) ? 'höchste Stufe' : 'geschätztes 1RM (kg)')}</div>`;
  }
  h += `<h2>Trainings</h2>`;
  if (!S.workouts.length) h += `<div class="card empty">Noch keine Trainings aufgezeichnet.</div>`;
  else h += `<div class="card list" style="padding:2px 14px">` + [...S.workouts].reverse().map(w => {
    const sets = w.entries.reduce((a, e) => a + e.sets.length, 0);
    return `<div class="item" data-a="woDetail" data-w="${w.id}"><div class="ico">${new Date(w.start).getDate()}</div><div class="grow"><div>${esc(w.name)}</div>
      <div class="muted small">${fmtDate(w.start)} · ${fmtDur((w.end || w.start) - w.start)} · ${sets} Sätze</div></div><span class="chev">›</span></div>`;
  }).join('') + `</div>`;
  return h;
}

/* ============ Workout ============ */
function cardioSuggest(t, last) {
  if (!last) return { lvl: t.level, cls: '', text: `Ziel: <b>${fmtN(t.minutes)} min</b> auf Stufe <b>${fmtN(t.level)}</b>.` };
  const lvl = Math.max(...last.sets.map(s => s.lvl || 0)), min = last.sets.reduce((a, s) => a + (s.min || 0), 0);
  if (min >= t.minutes) return { lvl: lvl + 1, cls: 'up', text: `↑ Letztes Mal ${fmtN(min)} min auf Stufe ${fmtN(lvl)} geschafft → versuche <b>Stufe ${fmtN(lvl + 1)}</b>` };
  return { lvl, cls: '', text: `→ <b>Stufe ${fmtN(lvl)}</b> halten, Ziel: <b>${fmtN(t.minutes)} min</b> (letztes Mal ${fmtN(min)} min)` };
}
function makeEntry(exId, t) {
  t = fullT(t);
  const last = lastPerf(exId);
  if (isCardio(exById(exId))) {
    const sg = cardioSuggest(t, last);
    return { id: uid(), exId, t, cardio: true, sugg: sg, prev: last ? last.sets.map(fmtCardio) : [],
      sets: [{ lvl: fmtN(sg.lvl), min: '', done: false }] };
  }
  const sg = suggest(exId, t);
  return { id: uid(), exId, t, sugg: sg, prev: last ? last.sets.map(s => `${fmtN(s.w)}×${s.r}`) : [],
    sets: Array.from({ length: Math.max(1, +t.sets || 1) }, () => ({ w: sg.w != null ? fmtN(sg.w) : '', r: '', rir: '', done: false })) };
}
function startWorkout(planId, dayId) {
  const p = planById(planId), d = p && p.days.find(x => x.id === dayId);
  S.current = { id: uid(), planId: planId || null, dayId: dayId || null, name: d ? d.name : 'Freies Training', start: Date.now(), timer: null,
    entries: d ? d.items.map(it => makeEntry(it.exId, { sets: +it.sets, repMin: +it.repMin, repMax: +it.repMax, rir: +it.rir, rest: +it.rest, minutes: num(it.minutes), level: num(it.level) })) : [] };
  ui.woOpen = true; save(); render(); unlockAudio();
}
/* Abgeschlossenes Training wieder öffnen: wird als S.current mit edit-Markierung geladen, das Original bleibt bis zum Speichern unverändert */

  if (S.current) return toast(S.current.edit ? 'Es wird bereits ein Training bearbeitet' : 'Erst das laufende Training beenden');

  S.current = { id: w.id, planId: w.planId, dayId: w.dayId, name: w.name, start: w.start, timer: null, edit: { end: w.end || w.start },
    entries: w.entries.map(e => ({ id: uid(), exId: e.exId, t: fullT(e.t), ...(e.cardio ? { cardio: true } : {}), sugg: {}, prev: [],
      sets: e.sets.map(s => e.cardio ? { lvl: fmtN(s.lvl), min: fmtN(s.min), done: true }
        : { w: fmtN(s.w), r: String(s.r ?? ''), rir: s.rir != null ? String(s.rir) : '', done: true }) })) };
  closeSheet(); ui.woOpen = true; save(); render();
}

function timerHTML() {
  const t = S.current && S.current.timer; if (!t) return '';
  const left = (t.end - Date.now()) / 1000, over = left <= 0;
  return `<div class="timer ${over ? 'over' : ''}" id="timer"><span class="t" id="timerT">${over ? '+' + fmtClock(-left) : fmtClock(left)}</span>
    <div class="bar"><i id="timerBar" style="width:${over ? 100 : Math.max(0, 100 - left / t.total * 100)}%;${over ? 'background:var(--ok)' : ''}"></i></div>
    <button class="iconbtn" data-a="timerAdd" data-k="-15">−15</button><button class="iconbtn" data-a="timerAdd" data-k="15">+15</button><button class="iconbtn" data-a="timerStop">✕</button></div>`;
}
function startTimer(sec) { S.current.timer = { end: Date.now() + sec * 1000, total: sec, beeped: false }; save(); }
let audioCtx = null;
function unlockAudio() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {} }
function beep() {
  if (!S.settings.sound || !audioCtx) return;
  try { [0, .25, .5].forEach(d => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    const t0 = audioCtx.currentTime + d; g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.4, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .18); o.start(t0); o.stop(t0 + .2); }); } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
setInterval(() => {
  const c = S && S.current; if (!c || !ui.woOpen || c.edit) return;
  const clk = $('#woClock'); if (clk) clk.textContent = fmtClock((Date.now() - c.start) / 1000);
  const t = c.timer; if (!t) return;
  const left = (t.end - Date.now()) / 1000, el = $('#timer');
  if (!el) return;
  if (left <= 0 && !t.beeped) { t.beeped = true; save(); beep(); }
  el.classList.toggle('over', left <= 0);
  $('#timerT').textContent = left <= 0 ? '+' + fmtClock(-left) : fmtClock(left);
  const b = $('#timerBar'); b.style.width = (left <= 0 ? 100 : Math.max(0, 100 - left / t.total * 100)) + '%'; b.style.background = left <= 0 ? 'var(--ok)' : '';
}, 250);

function finishWorkout() {
  const c = S.current;
  const entries = c.entries.map(e => ({ exId: e.exId, t: e.t, ...(e.cardio ? { cardio: true } : {}),
    sets: e.sets.filter(s => s.done).map(s => e.cardio ? { lvl: num(s.lvl) || 0, min: num(s.min) || 0 } : { w: num(s.w) || 0, r: num(s.r) || 0, rir: num(s.rir) }) })).filter(e => e.sets.length);
  const carMin = entries.filter(e => e.cardio).reduce((a, e) => a + e.sets.reduce((b, s) => b + s.min, 0), 0);
  const strSets = entries.filter(e => !e.cardio).reduce((a, e) => a + e.sets.length, 0);
  if (c.edit) {   // Bearbeitung: Original ersetzen, Datum und Dauer bleiben
    const i = S.workouts.findIndex(x => x.id === c.id);
    if (!entries.length) {
      if (!confirm('Keine abgehakten Sätze mehr. Gespeichertes Training löschen?')) return;
      if (i >= 0) S.workouts.splice(i, 1); S.current = null; ui.woOpen = false; save(); render(); toast('Training gelöscht'); return;
    }
    const nw = { id: c.id, planId: c.planId, dayId: c.dayId, name: c.name, start: c.start, end: c.edit.end, entries };
    if (i >= 0) S.workouts[i] = nw; else S.workouts.push(nw);
    S.current = null; ui.woOpen = false; save(); render(); toast('✓ Training aktualisiert'); return;
  }
  if (!entries.length) { if (confirm('Keine abgeschlossenen Sätze. Training verwerfen?')) { S.current = null; ui.woOpen = false; save(); render(); } return; }
  const w = { id: c.id, planId: c.planId, dayId: c.dayId, name: c.name, start: c.start, end: Date.now(), entries };
  const prs = entries.filter(e => !e.cardio).filter(e => { const b = bestE1rm(e.exId); const now = Math.max(...e.sets.map(s => e1rm(s.w, s.r, s.rir))); return b > 0 && now > b + 0.01; });
  S.workouts.push(w); S.current = null; ui.woOpen = false; save(); render();
  const vol = entries.reduce((b, e) => b + e.sets.reduce((c2, s) => c2 + (s.w || 0) * (s.r || 0), 0), 0);
  openSheet(`<div style="text-align:center;padding:10px 0 4px"><div style="font-size:48px">🏆</div><h2 style="margin:6px 0 2px">Starkes Training!</h2><div class="muted">${esc(w.name)}</div></div>
    <div class="stats" style="margin-top:14px"><div class="stat"><b>${fmtDur(w.end - w.start)}</b><span>Dauer</span></div><div class="stat"><b>${strSets}</b><span>Sätze</span></div>${carMin ? `<div class="stat"><b>${fmtN(carMin)}</b><span>min Cardio</span></div>` : `<div class="stat"><b>${Math.round(vol)}</b><span>kg Volumen</span></div>`}</div>
    ${prs.length ? `<div class="card"><div class="pr" style="margin-bottom:6px">⭐ Neue Rekorde (e1RM)</div>${prs.map(e => `<div class="small">${esc(exById(e.exId).name)}</div>`).join('')}</div>` : ''}
    <button class="btn block" data-a="closeSheet">Schließen</button>`);
}

async function cachedImgCount() {
  try { const c = await caches.open(IMG_CACHE); const keys = new Set((await c.keys()).map(r => r.url)); return allImgUrls().filter(u => keys.has(u)).length; }
  catch (e) { return null; }
}
async function updateImgStatus() {
  const el = $('#imgStatus'); if (!el) return;
  const n = await cachedImgCount(), all = allImgUrls().length;
  el.textContent = n == null ? 'Offline-Speicher in diesem Browser nicht verfügbar.' : `${n} von ${all} Fotos offline gespeichert.`;
}
async function downloadImgs(btn) {
  if (!('caches' in window)) return toast('Offline-Speicher nicht verfügbar');
  if (!navigator.onLine) return toast('Dafür wird eine Internetverbindung benötigt');
  btn.disabled = true;
  const c = await caches.open(IMG_CACHE), have = new Set((await c.keys()).map(r => r.url));
  const todo = allImgUrls().filter(u => !have.has(u));
  let done = 0, fail = 0;
  const worker = async () => {
    while (todo.length) {
      const u = todo.shift();
      try { const r = await fetch(u, { mode: 'no-cors', cache: 'no-store' }); await c.put(u, r); } catch (e) { fail++; }
      done++; btn.textContent = `Lade… ${done}/${done + todo.length}`;
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  btn.disabled = false; btn.textContent = 'Gerätefotos offline speichern';
  toast(fail ? `${fail} Fotos konnten nicht geladen werden` : 'Alle Fotos offline verfügbar');
  updateImgStatus();
}

/* ============ Export/Import von Plänen und Tagen (nur Grunddaten, keine absolvierten Trainings) ============ */
const ITEM_KEYS = ['exId', 'sets', 'repMin', 'repMax', 'rir', 'rest', 'minutes', 'level'];
const cleanDay = d => ({ name: d.name, items: (d.items || []).map(it => Object.fromEntries(ITEM_KEYS.filter(k => it[k] != null && it[k] !== '').map(k => [k, it[k]]))) });
const customFor = days => { const ids = new Set(days.flatMap(d => d.items.map(i => i.exId)));
  return S.exercises.filter(e => e.custom && ids.has(e.id)).map(e => ({ id: e.id, name: e.name, muscle: e.muscle, equip: e.equip, inc: e.inc, sec: e.sec || [] })); };
const fileName = s => (s || 'export').replace(/[^\wäöüÄÖÜß-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'export';
async function shareJSON(name, obj, title) {
  const blob = new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function exportPlans(plans, base) {
  shareJSON(`gymplan-${fileName(base)}.json`, { app: 'gymplan', type: 'plans', v: 1, exported: new Date().toISOString(),
    plans: plans.map(p => ({ name: p.name, days: p.days.map(cleanDay) })), exercises: customFor(plans.flatMap(p => p.days)) }, 'Gym Plan – ' + base);
}
function exportDay(d, planName) {
  shareJSON(`gymplan-tag-${fileName(d.name)}.json`, { app: 'gymplan', type: 'day', v: 1, exported: new Date().toISOString(),
    plan: planName, day: cleanDay(d), exercises: customFor([d]) }, 'Gym Plan – ' + d.name);
}
/* Datei lesen → { plans:[{name,days}], days:[…], skipped } ; akzeptiert Plan-, Tages- und komplette Backup-Dateien */
function parsePlanFile(txt) {
  const d = JSON.parse(txt);
  let plans = [];
  if (d && d.app === 'gymplan' && d.type === 'plans' && Array.isArray(d.plans)) plans = d.plans;
  else if (d && d.app === 'gymplan' && d.type === 'day' && d.day) plans = [{ name: d.plan || 'Importierter Plan', days: [d.day] }];
  else if (d && d.version && Array.isArray(d.plans)) plans = d.plans;     // komplettes Backup: nur die Pläne
  else throw new Error('Keine Gym-Plan-Datei');
  (d.version ? (d.exercises || []).filter(e => e && e.custom) : (d.exercises || [])).forEach(e => {
    if (e && e.id && e.name && !S.exercises.some(x => x.id === e.id))
      S.exercises.push({ id: e.id, name: e.name, muscle: e.muscle || 'Variabel', equip: e.equip || 'Maschine', inc: e.inc || 2.5, sec: e.sec || [], area: [], hn: false, cat: null, custom: true });
  });
  let skipped = 0;
  const mkDay = day => ({ id: uid(), name: String(day.name || 'Tag'), items: (day.items || []).filter(it => {
      const ok = it && S.exercises.some(e => e.id === it.exId); if (!ok) skipped++; return ok; })
    .map(it => Object.assign({ sets: 3, repMin: 8, repMax: 12, rir: 2, rest: 120, minutes: 15, level: 8 }, cleanDay({ items: [it] }).items[0], { id: uid() })) });
  plans = plans.filter(p => p && Array.isArray(p.days)).map(p => ({ name: String(p.name || 'Importierter Plan'), days: p.days.map(mkDay) }));
  return { plans, single: d.type === 'day', skipped };
}
function importPlanFile(txt) {
  let r; try { r = parsePlanFile(txt); } catch (e) { return toast('Ungültige Datei – bitte eine Gym-Plan-Exportdatei wählen'); }
  const note = r.skipped ? ` (${r.skipped} unbekannte Übung(en) übersprungen)` : '';
  if (ui.importMode === 'day') {     // in den geöffneten Plan einfügen
    const p = curPlan(); if (!p) return;
    const days = r.plans.flatMap(x => x.days); if (!days.length) return toast('Keine Trainingstage in der Datei');
    if (!confirm(`${days.length} Trainingstag(e) in „${p.name}“ einfügen?\n${days.map(d => '• ' + d.name).join('\n')}`)) return;
    days.forEach(d => { if (p.days.some(x => x.name === d.name)) d.name += ' (Import)'; p.days.push(d); });
    save(); render(); toast(`${days.length} Tag(e) importiert${note}`); return;
  }
  if (!r.plans.length) return toast('Keine Pläne in der Datei');
  if (!confirm(`${r.plans.length} Plan/Pläne importieren?\n${r.plans.map(p => `• ${p.name} (${p.days.length} Tage)`).join('\n')}`)) return;
  r.plans.forEach(p => { if (S.plans.some(x => x.name === p.name)) p.name += ' (Import)'; p.id = uid(); S.plans.push(p); });
  if (!S.activePlanId) S.activePlanId = r.plans[0].id;
  if (r.plans.length === 1) ui.planId = r.plans[0].id;
  save(); render(); toast(`${r.plans.length} Plan/Pläne importiert${note}`);
}

/* ============ Studio-Auslastung ============ */
/* Speicherformat (eigener Key, platzsparend): { v:1, d: { "YYYYMMDD": "<16 Zeichen Stunden 6–21 Uhr><96 Zeichen 10-min-Werte 6:00–21:50>" } }
   Ein Zeichen pro Wert: String.fromCharCode(48 + Prozent) → '0' = 0 %, 'd' = 52 % …; '.' = kein Wert. Ca. 115 Byte pro Tag (~40 KB pro Jahr). */
const UTIL_URL = 'https://rsg-group.api.magicline.com/connect/v1/studio/6859406990/utilization';
const UKEY = 'gymplan-util', U_H0 = 6, U_H1 = 22, U_NH = U_H1 - U_H0, U_NS = U_NH * 6, U_LEN = U_NH + U_NS;
let U = (() => { try { const d = JSON.parse(localStorage.getItem(UKEY)); if (d && d.d) return d; } catch (e) {} return { v: 1, d: {} }; })();
const uSave = () => { try { localStorage.setItem(UKEY, JSON.stringify(U)); } catch (e) { toast('⚠️ Auslastung konnte nicht gespeichert werden'); } };
const uEnc = p => String.fromCharCode(48 + Math.max(0, Math.min(100, Math.round(p))));
const uDec = c => c === '.' || c == null ? null : c.charCodeAt(0) - 48;
const dKey = dt => `${dt.getFullYear()}${String(dt.getMonth() + 1).padStart(2, '0')}${String(dt.getDate()).padStart(2, '0')}`;
const kDate = k => new Date(+k.slice(0, 4), +k.slice(4, 6) - 1, +k.slice(6, 8));
const kShift = (k, days) => { const d = kDate(k); d.setDate(d.getDate() + days); return dKey(d); };
const kIso = k => `${k.slice(0, 4)}-${k.slice(4, 6)}-${k.slice(6, 8)}`;
let uLast = 0, uLive = null, uErr = '';

async function fetchUtil(force) {
  if (!force && Date.now() - uLast < 9.5 * 60e3) return;
  uLast = Date.now();
  try {
    const r = await fetch(UTIL_URL, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(), now = new Date(), k = dKey(now);
    const rec = (U.d[k] || '.'.repeat(U_LEN)).split('');
    const items = j.items || []; const ci = items.findIndex(i => i.isCurrent);
    items.forEach((it, i) => {
      const h = parseInt(it.startTime); if (h < U_H0 || h >= U_H1) return;
      if (ci >= 0 && i > ci) return;                 // Zukunft = noch keine echten Werte
      rec[h - U_H0] = uEnc(it.percentage);
    });
    const cur = items[ci];
    if (cur) {
      uLive = { p: cur.percentage, level: cur.level, t: now };
      const h = now.getHours();
      if (h >= U_H0 && h < U_H1) rec[U_NH + (h - U_H0) * 6 + Math.floor(now.getMinutes() / 10)] = uEnc(cur.percentage);
    }
    if (rec.some(c => c !== '.')) { U.d[k] = rec.join(''); uSave(); }
    uErr = '';
  } catch (e) { uErr = 'Auslastung nicht abrufbar (offline?)'; }
  if (ui.tab === 'util' && !document.querySelector('#sheet.on') && !(document.activeElement && document.activeElement.matches('input'))) render();
}
function utilTick() {
  const h = new Date().getHours();
  if (document.visibilityState === 'visible' && h >= U_H0 && h < U_H1) fetchUtil();
  syncRepo();
}

/* Lückenlose Werte aus dem GitHub-Repo (Branch "data", per GitHub Action alle 10 Min. gesammelt) */
const REPO_DATA = 'https://raw.githubusercontent.com/brazzokarazzo/gym-plan/data/';
let uSyncAt = 0;
async function syncRepo(force) {
  if (!force && Date.now() - uSyncAt < 15 * 60e3) return;
  uSyncAt = Date.now();
  const now = new Date(), months = [];
  for (let i = 0; i < (U.synced ? 2 : 13); i++) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(dKey(d).slice(0, 6)); }
  let changed = false, ok = false;
  await Promise.all(months.map(async ym => {
    try {
      const r = await fetch(`${REPO_DATA}util-${ym}.json?t=${Math.floor(Date.now() / 6e5)}`, { cache: 'no-store' });
      if (r.status === 404) { ok = true; return; }
      if (!r.ok) return;
      const remote = await r.json(); ok = true;
      Object.entries(remote).forEach(([k, s]) => {
        if (typeof s !== 'string' || s.length !== U_LEN) return;
        const loc = U.d[k] || '.'.repeat(U_LEN);
        const merged = [...s].map((c, i) => c !== '.' ? c : loc[i]).join('');
        if (merged !== U.d[k]) { U.d[k] = merged; changed = true; }
      });
    } catch (e) {}
  }));
  if (ok && !U.synced) { U.synced = 1; changed = true; }
  if (changed) { uSave(); if (ui.tab === 'util' && !document.querySelector('#sheet.on') && !(document.activeElement && document.activeElement.matches('input'))) render(); }
}

/* Werte eines Tages: Stunden (API-Wert, sonst Mittel der 10-min-Werte) und 10-min-Reihe */
function uDay(k) {
  const s = U.d[k]; if (!s) return null;
  const slots = [...s.slice(U_NH)].map(uDec);
  const hours = [...s.slice(0, U_NH)].map((c, i) => {
    const v = uDec(c); if (v != null) return v;
    const xs = slots.slice(i * 6, i * 6 + 6).filter(x => x != null);
    return xs.length ? Math.round(xs.reduce((a, b) => a + b, 0) / xs.length) : null;
  });
  return { hours, slots };
}
const uAvg = a => { const xs = (a || []).filter(x => x != null); return xs.length ? Math.round(xs.reduce((x, y) => x + y, 0) / xs.length) : null; };
const uColor = p => p < 35 ? 'var(--ok)' : p < 65 ? 'var(--warn)' : 'var(--bad)';
const uKeys = () => Object.keys(U.d).sort();

function vUtil() {
  const today = dKey(new Date());
  const k = ui.utilDay || today, keys = uKeys();
  const day = uDay(k), prevK = kShift(k, -7), prev = uDay(prevK);
  const dLabel = kDate(k).toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
  const pIdx = keys.filter(x => x < k).pop(), nIdx = keys.find(x => x > k);
  const curH = k === today ? new Date().getHours() - U_H0 : -1;
  let h = `<div class="top"><h1>Studio</h1><button class="chip" data-a="utilRefresh">↻ Aktualisieren</button></div>`;
  if (k === today && uLive) {
    const lastWeekNow = prev && curH >= 0 && curH < U_NH ? prev.hours[curH] : null;
    h += `<div class="card"><div class="row between"><div><div class="muted small">Auslastung jetzt</div>
      <div style="font-size:34px;font-weight:800;color:${uColor(uLive.p)}">${uLive.p} %</div></div>
      <div style="text-align:right" class="muted small">Stand ${uLive.t.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}${lastWeekNow != null ? `<br>Vorwoche um diese Zeit: <b>${lastWeekNow} %</b>` : ''}</div></div></div>`;
  }
  if (uErr) h += `<div class="card muted small">⚠️ ${uErr}</div>`;
  h += `<div class="card"><div class="row" style="gap:8px">
      <button class="iconbtn" data-a="utilDay" data-k="${pIdx || ''}" ${pIdx ? '' : 'disabled style="opacity:.3"'}>‹</button>
      <input type="date" data-f="utilDate" value="${kIso(k)}" min="${keys[0] ? kIso(keys[0]) : kIso(today)}" max="${kIso(today)}" style="flex:1">
      <button class="iconbtn" data-a="utilDay" data-k="${nIdx || ''}" ${nIdx ? '' : 'disabled style="opacity:.3"'}>›</button></div>
    <div class="muted small" style="margin-top:8px;text-transform:capitalize">${dLabel}</div>`;
  if (!day) {
    h += `<div class="muted" style="padding:24px 0;text-align:center">Für diesen Tag ist keine Auslastung gespeichert.</div></div>`;
  } else {
    const avg = uAvg(day.hours), pAvg = prev ? uAvg(prev.hours) : null;
    const max = Math.max(...day.hours.filter(x => x != null)), maxH = day.hours.indexOf(max) + U_H0;
    const diff = avg != null && pAvg != null ? avg - pAvg : null;
    h += `<div class="ubars">${day.hours.map((p, i) => {
      const pp = prev ? prev.hours[i] : null;
      return `<div class="ucol ${i === curH ? 'cur' : ''}"><div class="uval">${p != null ? p : ''}</div><div class="utrack">
        ${p != null ? `<div class="ubar" style="height:${p}%;background:${uColor(p)}"></div>` : ''}
        ${pp != null ? `<div class="uprev" style="bottom:${pp}%"></div>` : ''}</div>
        <div class="ulbl">${(i % 2 === 0) ? i + U_H0 : ''}</div></div>`;
    }).join('')}</div>
    <div class="muted tiny" style="margin-top:6px">Balken = Auslastung je Stunde in % · <span class="uleg"></span> Strich = gleicher Wochentag der Vorwoche${prev ? '' : ' (keine Daten)'}</div></div>
    <div class="stats"><div class="stat"><b>${avg != null ? avg + ' %' : '–'}</b><span>Ø 6–22 Uhr</span></div>
      <div class="stat"><b>${isFinite(max) ? max + ' %' : '–'}</b><span>Spitze${isFinite(max) ? ` (${maxH}–${maxH + 1} Uhr)` : ''}</span></div>
      <div class="stat"><b style="color:${diff == null ? 'inherit' : diff > 0 ? 'var(--bad)' : 'var(--ok)'}">${diff == null ? '–' : (diff > 0 ? '+' : '') + diff}</b><span>vs. Vorwoche (%-Pkt.)</span></div></div>`;
    const pts = day.slots.map((p, i) => p == null ? null : [i, p]).filter(Boolean);
    if (pts.length >= 2) {
      const W = 340, H = 110, x = i => 24 + i * (W - 30) / (U_NS - 1), y = p => H - 18 - p * (H - 30) / 100;
      let path = '', prevI = -99;
      pts.forEach(([i, p]) => { path += `${i - prevI > 3 ? 'M' : 'L'}${x(i).toFixed(1)} ${y(p).toFixed(1)} `; prevI = i; });
      h += `<div class="card"><h3 style="margin-bottom:6px">Verlauf in 10-Minuten-Schritten</h3>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">
        ${[0, 50, 100].map(p => `<line x1="24" x2="${W - 6}" y1="${y(p)}" y2="${y(p)}" style="stroke:var(--line)" stroke-dasharray="3 4"/><text x="0" y="${y(p) + 3}" style="fill:var(--tx3)" font-size="9">${p}%</text>`).join('')}
        ${[6, 10, 14, 18, 22].map(hh => `<text x="${x((hh - U_H0) * 6 - (hh === 22 ? 1 : 0))}" y="${H - 4}" style="fill:var(--tx3)" font-size="9" text-anchor="middle">${hh}</text>`).join('')}
        <path d="${path}" fill="none" style="stroke:var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <div class="muted tiny">${pts.length} Messungen gespeichert</div></div>`;
    }
  }
  const bytes = (localStorage.getItem(UKEY) || '').length;
  h += `<div class="muted small" style="text-align:center;margin-top:6px">${keys.length} Tag(e) gespeichert · ${(bytes / 1024).toFixed(1)} KB<br>
    Werte werden automatisch alle 10 Min. (6–22 Uhr) über GitHub gesammelt und beim Öffnen nachgeladen.</div>`;
  return h;
}

/* ============ Start ============ */
S = load(); save();
if (S.current) ui.woOpen = true;
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
fetchUtil(true); syncRepo(true);
setInterval(utilTick, 60e3);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { fetchUtil(); syncRepo(); } });
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  // Updates sofort holen: sw.js nie aus dem HTTP-Cache, bei jedem Öffnen nach Updates schauen, nach Update einmal neu laden
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadSW || reloaded) return; reloaded = true;
    if (document.activeElement && document.activeElement.matches('input')) return;   // nicht beim Tippen neu laden
    location.reload();
  });
}
</script>
